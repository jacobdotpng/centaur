[project]
name = "centaur-workflows"
version = "0.1.0"
description = "Discover, start and verify durable Centaur workflows (distinct from Console scheduled tasks)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
centaur-workflows = "centaur_tool_centaur_workflows.cli:app"

[tool.centaur]
module = "client.py"
hosts = []
secrets = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_centaur_workflows"
