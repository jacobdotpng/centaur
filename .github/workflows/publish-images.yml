name: Publish production images
on:
  push:
    branches: [production]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-images
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  console-checks:
    uses: ./.github/workflows/console-ci.yml
  build:
    needs: [checks, console-checks]
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: api-rs, context: '.', file: services/api-rs/Dockerfile, target: ''}
          - {service: proxy-sync, context: '.', file: services/proxy-sync/Dockerfile, target: ''}
          - {service: token-broker, context: '.', file: services/token-broker/Dockerfile, target: ''}
          - {service: slackbotv2, context: '.', file: services/slackbotv2/Dockerfile, target: ''}
          - {service: agent, context: '.', file: services/sandbox/Dockerfile, target: sandbox}
          - {service: iron-proxy, context: '.', file: services/iron-proxy/Dockerfile, target: ''}
          - {service: console, context: services/console, file: services/console/Dockerfile, target: ''}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reclaim runner disk for the sandbox toolchain
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact revision
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/centaur-${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record immutable image digest
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p release
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          service = os.environ['SERVICE']
          image = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'] + '/centaur-' + service + '@' + os.environ['DIGEST']
          Path('release/' + service + '.json').write_text(json.dumps({service: image}))
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-${{ matrix.service }}
          path: release/*.json
          retention-days: 7
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: image-*
          path: release
          merge-multiple: true
      - name: Publish complete release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          images = {}
          for path in Path('release').glob('*.json'):
              images.update(json.loads(path.read_text()))
          expected = {'agent','api-rs','console','iron-proxy','proxy-sync','slackbotv2','token-broker'}
          assert set(images) == expected, 'Incomplete image set'
          Path('release.json').write_text(json.dumps({'schema':1,'repository':os.environ['GITHUB_REPOSITORY'],'commit':os.environ['GITHUB_SHA'],'images':images}, indent=2) + '\n')
          PYCODE
          tag="centaur-${GITHUB_SHA}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This revision already has a release; preserving its original digests.'
          else
            gh release create "$tag" release.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Centaur ${GITHUB_SHA:0:12}" --notes 'Images built from the exact production revision. Deployment selects immutable digests.'
          fi
