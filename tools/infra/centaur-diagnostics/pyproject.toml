[project]
name = "centaur-diagnostics"
version = "0.1.0"
description = "Read deployed Centaur status and diagnostics through the configured proxy"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
centaur-diagnostics = "centaur_tool_centaur_diagnostics.cli:app"

[tool.centaur]
module = "client.py"
hosts = []
secrets = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_centaur_diagnostics"
